<!doctype html>
<!-- Drives the UI in an iframe and reports what it finds; served by dev_server.py at /dev/check for headless checks. -->
<html><body>
<pre id="out">running…</pre>
<iframe id="f" src="/ui/#/resources" style="width:1400px;height:900px"></iframe>
<script>
const out = [], errors = [];
const f = document.getElementById('f');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const doc = () => f.contentDocument, win = () => f.contentWindow;
const byText = (sel, text) => [...doc().querySelectorAll(sel)].find((e) => e.textContent.trim() === text || e.textContent.trim().startsWith(text));
async function waitFor(fn, what, tries = 150) { for (let i = 0; i < tries; i++) { try { const v = fn(); if (v) return v; } catch {} await sleep(100); } throw new Error('timeout waiting for ' + what); }
async function go(hash) { win().location.hash = hash; await sleep(50); await waitFor(() => doc().querySelector('#main .rc, #main .empty, #main .card'), 'page ' + hash); await sleep(300); }
function dialog() { return doc().querySelector('.dialog'); }
function cancel() { const b = [...doc().querySelectorAll('.dialog .btn')].find((e) => e.textContent.trim() === 'Cancel'); if (b) b.click(); }
function check(name, cond, detail = '') { out.push(`${cond ? 'ok  ' : 'FAIL'} ${name}${detail ? ' · ' + detail : ''}`); }
async function run() {
  await waitFor(() => doc() && doc().querySelector('#main .rc'), 'first render');
  win().addEventListener('error', (e) => errors.push(String(e.message)));
  // 1. segments input on + Resource, splitting on / and ,
  await go('#/resources');
  byText('.btn', '+ Resource').click(); await waitFor(dialog, 'resource dialog');
  const seg = dialog().querySelector('input.seg'); check('resource dialog has a segment input', !!seg);
  seg.value = 'devices/pnnl,seb'; seg.dispatchEvent(new (win().Event)('input', { bubbles: true })); await sleep(50);
  const chips = [...dialog().querySelectorAll('input.seg')].map((i) => i.value);
  check('typing separators makes segments', JSON.stringify(chips) === JSON.stringify(['devices', 'pnnl', 'seb']), chips.join('|'));
  const lastChip = [...dialog().querySelectorAll('input.seg')].pop(); lastChip.focus();
  lastChip.dispatchEvent(new (win().KeyboardEvent)('keydown', { key: 'Tab', bubbles: true, cancelable: true })); await sleep(30);
  const fresh = [...dialog().querySelectorAll('input.seg')].pop();
  check('Tab on a filled chip adds an empty one, focused', fresh !== lastChip && doc().activeElement === fresh);
  fresh.dispatchEvent(new (win().KeyboardEvent)('keydown', { key: 'Backspace', bubbles: true, cancelable: true })); await sleep(30);
  check('Backspace on the empty chip removes it and focuses the previous', dialog().querySelectorAll('input.seg').length === 3 && doc().activeElement === lastChip, doc().activeElement && doc().activeElement.value);
  check('resource dialog labels carry tooltips', dialog().querySelectorAll('[data-tip]').length >= 4, String(dialog().querySelectorAll('[data-tip]').length));
  cancel();
  // 1b. keyboard: the first field is focused, Enter runs the primary action, buttons are tabbable, Escape closes
  byText('.btn', '+ Resource').click(); await waitFor(dialog, 'resource dialog'); await sleep(30);
  check('dialog focuses its first field', doc().activeElement && doc().activeElement.classList.contains('seg'));
  check('dialog buttons are tabbable', [...dialog().querySelectorAll('.btn')].every((b) => b.getAttribute('tabindex') === '0'));
  doc().activeElement.dispatchEvent(new (win().KeyboardEvent)('keydown', { key: 'Enter', bubbles: true, cancelable: true })); await sleep(50);
  check('Enter submits (validation toast, dialog stays)', !!dialog() && !!byText('.toast', 'UAI and format are required'));
  dialog().dispatchEvent(new (win().KeyboardEvent)('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await sleep(30);
  check('Escape closes the dialog', !dialog());
  // 1c. tabbed layout: the highlight follows the clicked tab and the sections are not collapsed
  win().localStorage.setItem('rc:layout', 'tabs'); await go('#/resources?uai=' + encodeURIComponent('matrix/SunSpec/client')); win().location.reload(); await sleep(1500);
  await waitFor(() => doc().querySelector('.ctabs'), 'tab bar');
  const tabsBar = doc().querySelector('.ctabs'); const tabOf = (label) => [...tabsBar.children].find((t) => t.textContent.startsWith(label));
  tabOf('Parameters').click(); await sleep(50);
  check('tab highlight follows the clicked tab', tabOf('Parameters').classList.contains('on') && !tabOf('Aliases').classList.contains('on') && !tabOf('Consumers').classList.contains('on'));
  check('tab section is not collapsed', !doc().querySelector('.rc .rsec.col') && !!doc().querySelector('.rc .rsec h5'));
  tabOf('Consumers').click(); await sleep(50);
  check('consumers tab highlighted and shown', tabOf('Consumers').classList.contains('on') && !tabOf('Parameters').classList.contains('on') && !doc().querySelector('.rc .rsec.col'));
  win().localStorage.setItem('rc:layout', 'stacked'); win().location.reload(); await sleep(1500); await waitFor(() => doc().querySelector('#main .rc'), 'stacked again');
  check('stacked sections start open', [...doc().querySelectorAll('.rc .rsec.col .tri')].every((t) => t.textContent.trim() === '▾'));
  // 2. Edit on a canonical opens the prefilled form
  byText('.rc .btn', 'Edit').click(); await waitFor(dialog, 'edit resource dialog');
  const pre = [...dialog().querySelectorAll('input.seg')].map((i) => i.value);
  check('canonical Edit is the form, prefilled', dialog().querySelector('h4').textContent.startsWith('Edit') && pre.length === 3, `${dialog().querySelector('h4').textContent} · ${pre.join('/')} · format ${dialog().querySelector('select').value}`);
  check('canonical Edit format prefilled', !!dialog().querySelector('select').value);
  cancel();
  // 3. Edit on an alias
  await go('#/resources?alias=' + encodeURIComponent('openfmb/solarmodule/SolarReadingProfile/7d1a2b3c-0000-4000-8000-000000000001'));
  byText('.rc .btn', 'Edit').click(); await waitFor(dialog, 'edit alias dialog');
  const apre = [...dialog().querySelectorAll('input.seg')].map((i) => i.value);
  check('alias Edit is the form, prefilled', dialog().querySelector('h4').textContent.startsWith('Edit alias') && apre.length === 4 && !!dialog().querySelector('select').value, `${apre.join('/')} · ${dialog().querySelector('select').value}`);
  check('alias Edit hides delivery', !dialog().textContent.includes('a remote topic on a bus'));
  cancel();
  // 4. + Alias form: delivery radios present, Save label
  byText('.btn', '+ Alias').click(); await waitFor(dialog, 'add alias dialog');
  check('add alias dialog offers alias parameters', !![...dialog().querySelectorAll('input')].find((i) => i.placeholder.includes('mrid')));
  check('add alias dialog has segments, delivery and Save', !!dialog().querySelector('input.seg') && dialog().textContent.includes('a remote topic on a bus') && !![...dialog().querySelectorAll('.btn')].find((b) => b.textContent.trim() === 'Save'));
  cancel();
  // 5. Bridges: Edit prefilled
  await go('#/bridges');
  byText('.rc .btn', 'Edit').click(); await waitFor(dialog, 'edit bridge dialog');
  const sels = [...dialog().querySelectorAll('select')].map((s) => s.value);
  check('bridge Edit prefilled', dialog().querySelector('h4').textContent === 'Edit the device bridge' && sels.every(Boolean), sels.join(' → '));
  check('bridge dialog has a points field', !![...dialog().querySelectorAll('input')].find((i) => i.placeholder === 'empty: all points'));
  cancel();
  // 6. Agents listed, with status
  await go('#/agents');
  const tree = [...doc().querySelectorAll('#side .tree > div')].map((d) => d.textContent.trim());
  check('agents listed', tree.length >= 4 && !doc().querySelector('#main .empty'), tree.join(', '));
  check('agent state shows pid', doc().querySelector('#ctx') && doc().querySelector('#ctx').textContent.includes('pid') && /pid\s*10\d/.test(doc().querySelector('#ctx').textContent.replace(/\n/g, ' ')));
  // 6b. Deleting a canonical with dependents: a decision per row, approval for kept ones
  await go('#/resources?uai=' + encodeURIComponent('matrix/SunSpec/client'));
  byText('.rc .btn', '⋯').click(); await sleep(100); [...doc().querySelectorAll('.menu2 div')].find((e) => e.textContent.startsWith('Delete')).click(); await waitFor(dialog, 'delete dialog');
  const rows = dialog().querySelectorAll('tr').length - 1, delBtn = [...dialog().querySelectorAll('.btn')].find((b) => b.textContent.trim() === 'Delete');
  check('delete dialog lists dependents', rows >= 3, String(rows));
  check('Delete disabled until decided', delBtn.classList.contains('dis'));
  for (const r of dialog().querySelectorAll('input.rad')) if (r.closest('label').textContent.includes('keep')) { r.checked = true; r.dispatchEvent(new (win().Event)('change', { bubbles: true })); }
  await sleep(50);
  const approval = [...dialog().querySelectorAll('input.box')].pop();
  check('keeping asks for approval, Delete still disabled', approval && !approval.closest('div').classList.contains('hidden') && delBtn.classList.contains('dis'));
  approval.checked = true; approval.dispatchEvent(new (win().Event)('change', { bubbles: true })); await sleep(50);
  check('approval enables Delete', !delBtn.classList.contains('dis'));
  [...dialog().querySelectorAll('.btn')].find((b) => b.textContent.trim() === 'Cancel').click(); await sleep(50);
  check('cancel closes without deleting', !dialog() && !!byText('.rc .btn', '⋯'));
  // 6c. Bus adapter: typed settings form in edit mode, and Create opens a form
  await go('#/agents?identity=platform.bus_adapter&edit=1'); await sleep(400);
  const typeSel = [...doc().querySelectorAll('#main select')].find((s) => [...s.options].some((o) => o.value === 'mqtt'));
  check('bus adapter edit has a bus type select', !!typeSel && typeSel.value === 'mqtt', typeSel ? typeSel.value : doc().querySelector('#main').textContent.replace(/\s+/g, ' ').slice(-400));
  check('bus adapter edit shows the bus settings form', [...doc().querySelectorAll('#main input')].some((i) => i.value === '127.0.0.1') && !!byText('#main .btn', '+ Bus'));
  for (const adv of [...doc().querySelectorAll('#main .rsec.col h5')].filter((e) => e.textContent.includes('Advanced'))) adv.click();    // the credentials are advanced fields
  await sleep(100);
  check('password fields are masked', [...doc().querySelectorAll('#main input[type=password]')].length >= 1);
  let created = null;
  for (const item of [...doc().querySelectorAll('#side .tree > div')]) { item.click(); await sleep(400); const c = byText('#main .btn', 'Create'); if (c) { created = item.textContent.trim(); c.click(); await sleep(400); break; } }
  check('Create opens the editor at once', !!created && !!byText('#main .btn', 'Save') && !!doc().querySelector('#main textarea, #main .grid.kv1 input, #main .grid.kv1 select'), created || 'no agent without config');
  await go('#/agents?identity=platform.presentation'); await sleep(400);
  check('service card shows its lists with links, no Edit, no JSON', !!byText('#main .btn', 'Open Resources ▸') && !byText('.rc .r .btn', 'Edit') && !doc().querySelector('#main pre'));
  // 6d. Bridges: ⚙ opens the settings dialog
  await go('#/bridges');
  byText('#side .hd', '⚙ bus adapter').click(); await waitFor(dialog, 'settings dialog');
  check('bridges ⚙ opens the bus adapter settings', dialog().querySelector('h4').textContent.includes('platform.bus_adapter') && !![...dialog().querySelectorAll('select')].find((s) => s.value === 'mqtt'));
  cancel();
  // 7. Devices: tooltips are CSS, not title
  await go('#/devices');
  const tip = doc().querySelector('#main .tip[data-tip]'); check('device labels have css tooltips', !!tip && !tip.getAttribute('title'));
  const after = tip && win().getComputedStyle(tip, '::after'); check('tooltip pseudo-element styled', !!after && after.content !== 'none' && after.content !== '');
  // device edit uses segments
  byText('.rc .btn', 'Edit').click(); await sleep(400);
  check('device edit topic is segments', doc().querySelectorAll('#main input.seg').length >= 3, String(doc().querySelectorAll('#main input.seg').length));
  const wraps = doc().querySelectorAll('#main .segs.slash .segw');
  check('device topic chips show slashes between them', wraps.length >= 2 && win().getComputedStyle(wraps[1], '::before').content.includes('/') && win().getComputedStyle(wraps[0], '::before').content === 'none');
  const wide = doc().querySelector('#main input.seg'); wide.value = 'averyveryverylongsegmentname'; wide.dispatchEvent(new (win().Event)('input', { bubbles: true })); await sleep(30);
  check('a long segment is not clipped', wide.scrollWidth <= wide.clientWidth + 1, `${wide.scrollWidth} vs ${wide.clientWidth}`);
}
run().catch((e) => errors.push('check: ' + e.message)).then(() => { document.getElementById('out').textContent = out.join('\n') + '\nerrors: ' + JSON.stringify(errors); });
</script></body></html>
